    <script>
        // =========================================================================
        // ENLACE DE GOOGLE SHEETS INTEGRADO
        // =========================================================================
        const urlDelExcel = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTY3pSQRl_Sh7xG--woGXQvMAOSfoMpqIzxA8qn95TDNnqk9yOAflX-DSNQrkuqWkbEiyK1sEN_qdUF/pub?output=csv"; 
        
        let miAgenda = []; 
        let currentContact = null;

        window.onload = function() {
            const currentMonth = new Date().getMonth();
            document.getElementById('monthFilter').value = currentMonth;
            
            if(urlDelExcel === "PEGAR_AQUI_EL_ENLACE_QUE_COPIASTE") {
                document.getElementById('eventsList').innerHTML = '<li style="text-align:center; padding:20px; color:red; font-weight:bold;">¡Falta configurar el enlace de Google Sheets en el código!</li>';
                return;
            }

            Papa.parse(urlDelExcel, {
                download: true,
                header: true,
                complete: function(results) {
                    miAgenda = results.data.filter(contacto => contacto.Nombre);
                    renderEvents();
                },
                error: function(error) {
                    document.getElementById('eventsList').innerHTML = '<li style="text-align:center; padding:20px; color:red;">Hubo un error leyendo tu Excel. Revisa que el enlace sea correcto.</li>';
                }
            });
        };

        function renderEvents() {
            const selectedMonth = document.getElementById('monthFilter').value;
            const selectedOccasion = document.getElementById('occasionFilter').value;
            const eventsList = document.getElementById('eventsList');
            eventsList.innerHTML = '';

            let filteredEvents = [];

            if (selectedOccasion !== "ninguna") {
                filteredEvents = miAgenda.filter(contacto => {
                    const categoriaStr = (contacto.Categoria || "").toLowerCase();
                    return categoriaStr.includes(selectedOccasion);
                });
                filteredEvents.sort((a, b) => a.Nombre.localeCompare(b.Nombre));
            } 
            else {
                filteredEvents = miAgenda.filter(contacto => {
                    if (!contacto.Fecha) return false;
                    if (selectedMonth === "todos") return true;
                    const parts = contacto.Fecha.split('/');
                    return (parseInt(parts[1]) - 1) == selectedMonth;
                });
                filteredEvents.sort((a, b) => {
                    return parseInt(a.Fecha.split('/')[0]) - parseInt(b.Fecha.split('/')[0]);
                });
            }

            if (filteredEvents.length === 0) {
                eventsList.innerHTML = '<li style="text-align:center; padding:20px; color:#777;">No hay contactos para este filtro.</li>';
                return;
            }

            const currentYear = new Date().getFullYear();
            const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

            filteredEvents.forEach((ev, index) => {
                let desc, icon, cardClass;
                let detailText = "";
                let isFallecido = false;
                
                // --- LÓGICA DE LA FOTO ---
                let fotoUrl = (ev.Foto || ev.foto || "").trim();
                let fotoHtml = "";
                if (fotoUrl !== "") {
                    fotoHtml = `<img src="${fotoUrl}" alt="Foto de ${ev.Nombre}" class="contact-photo">`;
                } else {
                    fotoHtml = `<div class="contact-photo default-photo">👤</div>`;
                }

                if (selectedOccasion !== "ninguna") {
                    icon = "💐"; cardClass = "especial";
                    if(selectedOccasion === "madre") desc = "Día de la Madre";
                    if(selectedOccasion === "padre") { desc = "Día del Padre"; icon = "👔"; }
                    if(selectedOccasion === "medico") { desc = "Día del Médico"; icon = "🩺"; }
                    if(selectedOccasion === "ingeniero") { desc = "Día del Ingeniero"; icon = "📐"; }
                    detailText = `<p><strong>${desc}</strong></p>`;
                } 
                else {
                    const parts = ev.Fecha.split('/');
                    const day = parts[0];
                    const monthName = meses[parseInt(parts[1]) - 1];
                    const years = currentYear - parseInt(parts[2]);
                    const tipoLow = (ev.Tipo || "").toLowerCase();

                    if (tipoLow === "cumpleaños" || tipoLow === "cumpleanos") {
                        desc = `Cumple ${years} años`; icon = "🎂"; cardClass = ev.Tono.toLowerCase() === 'amoroso' ? 'amoroso' : '';
                    } else {
                        isFallecido = true;
                        desc = `${years} años de su partida`; icon = "🕊️"; cardClass = 'defuncion';
                    }
                    detailText = `<p><strong>${day} de ${monthName}</strong> - ${desc}</p>`;
                }

                // Generar los botones dinámicamente según si es fallecido o no
                let botonesHtml = "";
                if (isFallecido) {
                    botonesHtml = `
                        <div class="action-buttons">
                            <button class="btn-redactar" onclick="abrirRedactor(${index})">Mensaje</button>
                            <button class="btn-postal" onclick="abrirPostal(${index})">Preparar Postal</button>
                        </div>
                    `;
                } else {
                    botonesHtml = `
                        <div class="action-buttons">
                            <button class="btn-redactar" style="width:100%" onclick="abrirRedactor(${index})">Preparar Mensaje</button>
                        </div>
                    `;
                }

                const li = document.createElement('li');
                li.className = `event-card ${cardClass}`;
                li.innerHTML = `
                    <div class="event-card-content">
                        ${fotoHtml}
                        <div class="event-info">
                            <h3>${icon} ${ev.Nombre}</h3>
                            ${detailText}
                            <p style="font-size:11px; margin-top:3px;">Relación: ${ev.Relacion} | Tono: ${ev.Tono}</p>
                        </div>
                    </div>
                    ${botonesHtml}
                `;
                eventsList.appendChild(li);
            });

            window.filteredEvents = filteredEvents;
        }

        function generarMensaje(contacto, paraPostal = false) {
            const selectedOccasion = document.getElementById('occasionFilter').value;
            let tono = (contacto.Tono || "normal").toLowerCase();
            let nombreCorto = contacto.Nombre.split(' ')[0];
            const currentYear = new Date().getFullYear();
            const years = currentYear - parseInt(contacto.Fecha.split('/')[2]);
            const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const dia = contacto.Fecha.split('/')[0];
            const mesNombre = meses[parseInt(contacto.Fecha.split('/')[1]) - 1];

            if (selectedOccasion !== "ninguna") {
                if (selectedOccasion === "madre") return `¡Feliz Día de la Madre, ${nombreCorto}! Un abrazo. 🌸`;
                if (selectedOccasion === "padre") return `¡Feliz Día del Padre, ${nombreCorto}! Un abrazo. 🍻`;
                if (selectedOccasion === "medico") return `¡Feliz Día del Médico, ${nombreCorto}! 🩺`;
                if (selectedOccasion === "ingeniero") return `¡Feliz Día del Ingeniero, ${nombreCorto}! 📐`;
            }

            let tipo = (contacto.Tipo || "").toLowerCase();

            if (tipo === "cumpleaños" || tipo === "cumpleanos") {
                if (tono === "amoroso") return `¡Mi amor! Hoy celebramos un año más de tu vida. Felices ${years} años. ¡Te amo muchísimo! ❤️`;
                return `¡Hola ${nombreCorto}! Espero que estés muy bien. Te escribo para desearte un muy feliz cumpleaños. ¡Un abrazo! 🎂`;
            } 
            else if (tipo === "defuncion" || tipo === "defunción") {
                // Mensaje sugerido especial para POSTAL
                if (paraPostal) {
                    return `En este día, con profundo amor y respeto, nos unimos para honrar el ${years}º aniversario de la partida de nuestro/a inolvidable ${contacto.Relacion}.\n\nHoy, ${dia} de ${mesNombre}, elevamos una oración y recordamos con mucho amor a ${contacto.Nombre}, al cumplirse ${years} años de su descanso. Su recuerdo sigue siendo una luz en nuestras vidas.\n\nUn abrazo a la familia. 🙏🕊️`;
                }
                // Mensaje sugerido para texto plano
                return `Hoy elevamos una oración y recordamos con mucho amor a ${contacto.Nombre}, al cumplirse ${years} años de su descanso. Un abrazo a la familia. 🙏🕊️`;
            }
            return `¡Hola ${nombreCorto}! Te envío un saludo.`;
        }

        // =========================================
        // LÓGICA DEL MENSAJE DE TEXTO NORMAL
        // =========================================
        function abrirRedactor(index) {
            currentContact = window.filteredEvents[index];
            if (!currentContact) return;

            prepararContactoNumero(currentContact);
            document.getElementById('messageBox').value = generarMensaje(currentContact, false);
            document.getElementById('msgModal').style.display = "flex";
        }

        // =========================================
        // LÓGICA DE LA POSTAL CONMEMORATIVA
        // =========================================
        function abrirPostal(index) {
            currentContact = window.filteredEvents[index];
            if (!currentContact) return;

            prepararContactoNumero(currentContact);
            
            // Cargar datos en la vista previa
            document.getElementById('pName').innerText = currentContact.Nombre.toUpperCase();
            
            let fotoUrl = (currentContact.Foto || currentContact.foto || "").trim();
            let imgEl = document.getElementById('pImg');
            let imgContainer = document.querySelector('.postal-img-container');
            
            if(fotoUrl) {
                imgEl.src = fotoUrl;
                imgContainer.style.display = 'block';
            } else {
                imgContainer.style.display = 'none'; // Si no tiene foto, ocultamos el círculo superior
            }
            
            // Generar el texto y ponerlo en el editor
            const textoSugerido = generarMensaje(currentContact, true);
            document.getElementById('postalTextBox').value = textoSugerido;
            updatePostalText(); // Sincroniza la vista previa

            document.getElementById('postalModal').style.display = "flex";
        }

        function updatePostalText() {
            // Reemplaza los saltos de línea por <br> para que se vean en el HTML
            const texto = document.getElementById('postalTextBox').value;
            document.getElementById('pText').innerHTML = texto.replace(/\n/g, '<br>');
        }

        async function sharePostal() {
            const btn = document.getElementById('btnSharePostal');
            btn.innerHTML = "Generando Postal... ⏳";
            btn.disabled = true;

            const previewDiv = document.getElementById('postalPreview');
            const mensajeTexto = document.getElementById('postalTextBox').value;

            try {
                // html2canvas toma "una foto" del div y lo vuelve imagen
                // useCORS es clave para que pueda leer las fotos externas (si el servidor lo permite)
                const canvas = await html2canvas(previewDiv, { 
                    scale: 2, 
                    useCORS: true,
                    backgroundColor: "#ffffff"
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "Postal_Conmemorativa.png", { type: "image/png" });

                    // Usar la API de compartir nativa (ideal para celulares: te abre WhatsApp con la foto adjunta)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Postal Conmemorativa',
                                text: mensajeTexto // Acompaña la imagen con el texto en WhatsApp
                            });
                        } catch (err) {
                            console.log("El usuario canceló o falló al compartir.", err);
                        }
                    } else {
                        // Fallback para navegadores que no soportan Web Share (ej. PC)
                        alert("Tu navegador no soporta enviar la imagen directo. Se descargará la postal a tu galería y se abrirá WhatsApp para que la adjuntes manualmente.");
                        
                        // Descargar imagen
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `Postal_${currentContact.Nombre.replace(/\s+/g, '_')}.png`;
                        a.click();
                        
                        // Abrir WhatsApp con el texto (el usuario debe adjuntar la foto desde su galería)
                        const encodedMessage = encodeURIComponent(mensajeTexto);
                        let waUrl = currentContact.esGrupo 
                            ? `https://wa.me/?text=${encodedMessage}`
                            : `https://wa.me/${currentContact.telefonoLimpio}?text=${encodedMessage}`;
                        
                        setTimeout(() => { window.open(waUrl, '_blank'); }, 1000);
                    }
                    
                    resetBtnPostalState(btn);
                    closeModal('postalModal');
                }, 'image/png');
                
            } catch (error) {
                console.error(error);
                alert("Hubo un error al generar la imagen. Si usas fotos de Google Drive/Photos, a veces bloquean la captura por seguridad (CORS).");
                resetBtnPostalState(btn);
            }
        }

        function resetBtnPostalState(btn) {
            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Compartir Postal por WhatsApp
            `;
            btn.disabled = false;
        }

        // =========================================
        // UTILIDADES COMUNES
        // =========================================
        function prepararContactoNumero(contacto) {
            let tel = (contacto.Telefono || "").trim().toLowerCase();
            if (tel === "grupo") {
                contacto.esGrupo = true;
            } else {
                contacto.esGrupo = false;
                contacto.telefonoLimpio = contacto.Telefono.replace(/\D/g, '');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function sendWhatsApp() {
            if (!currentContact) return;

            const finalMessage = document.getElementById('messageBox').value;
            const encodedMessage = encodeURIComponent(finalMessage);
            let waUrl = "";

            if (currentContact.esGrupo) {
                waUrl = `https://wa.me/?text=${encodedMessage}`;
            } else {
                if (!currentContact.telefonoLimpio) {
                    alert("Por favor, pon un número o escribe 'Grupo' en la columna Telefono de tu Excel.");
                    return;
                }
                waUrl = `https://wa.me/${currentContact.telefonoLimpio}?text=${encodedMessage}`;
            }
            
            window.open(waUrl, '_blank');
            closeModal('msgModal');
        }
    </script>
</body>
